<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10z" fill="#8F7E6D"/>
    </marker>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#B5734A"/><stop offset="1" stop-color="#D4A574"/></linearGradient>
  </defs>
  <rect width="1040" height="300" rx="18" fill="#F5EDE3"/>

  <!-- Claude -->
  <rect x="30" y="100" width="210" height="100" rx="14" fill="#FAF5EF" stroke="#D9C9B6"/>
  <text x="135" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#2C2418">Claude Code</text>
  <text x="135" y="164" text-anchor="middle" font-size="14" fill="#6B5B4D">or Claude Desktop</text>

  <!-- arrow MCP -->
  <line x1="240" y1="150" x2="300" y2="150" stroke="#8F7E6D" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="270" y="136" text-anchor="middle" font-size="12" fill="#6B5B4D">MCP · stdio</text>

  <!-- bridge -->
  <rect x="300" y="88" width="250" height="124" rx="14" fill="url(#g)"/>
  <text x="425" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">omniflow-mcp</text>
  <text x="425" y="152" text-anchor="middle" font-size="13" fill="#FFF3E6">5 tools · local bridge</text>
  <text x="425" y="172" text-anchor="middle" font-size="13" fill="#FFF3E6">127.0.0.1:8787 · zero deps</text>
  <text x="425" y="196" text-anchor="middle" font-size="12" fill="#FFF3E6">this repository</text>

  <!-- arrow HTTP -->
  <line x1="550" y1="150" x2="620" y2="150" stroke="#8F7E6D" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="585" y="136" text-anchor="middle" font-size="12" fill="#6B5B4D">HTTP · polled</text>

  <!-- extension -->
  <rect x="620" y="100" width="200" height="100" rx="14" fill="#FAF5EF" stroke="#D9C9B6"/>
  <text x="720" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#2C2418">OmniFlow</text>
  <text x="720" y="164" text-anchor="middle" font-size="14" fill="#6B5B4D">Chrome extension</text>

  <!-- arrow DOM -->
  <line x1="820" y1="150" x2="870" y2="150" stroke="#8F7E6D" stroke-width="2" marker-end="url(#a)"/>

  <!-- Flow -->
  <rect x="870" y="100" width="140" height="100" rx="14" fill="#FAF5EF" stroke="#D9C9B6"/>
  <text x="940" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#2C2418">Google Flow</text>
  <text x="940" y="164" text-anchor="middle" font-size="14" fill="#6B5B4D">Veo 3 · Omni 1.1</text>

  <!-- files -->
  <line x1="425" y1="212" x2="425" y2="250" stroke="#8F7E6D" stroke-width="2" marker-end="url(#a)"/>
  <text x="425" y="272" text-anchor="middle" font-size="13" fill="#6B5B4D">clips + metadata → omniflow-out/</text>

  <!-- playbook -->
  <text x="720" y="236" text-anchor="middle" font-size="12" fill="#8F7E6D">sends the director playbook on connect</text>
  <text x="720" y="252" text-anchor="middle" font-size="12" fill="#8F7E6D">→ flow_status → Claude</text>
</svg>
