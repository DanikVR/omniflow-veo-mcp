name: Publish to npm

# Пуш тега v1.2.3 → проверка синтаксиса → npm publish через Trusted Publishing (OIDC).
# Токены не нужны: на npmjs.com у пакета настроен trusted publisher
# (GitHub Actions, DanikVR/omniflow-veo-mcp, publish.yml). Нужен npm ≥ 11.5.1 — ставим свежий.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm run check
      - name: Publish to npm (trusted publishing, provenance)
        run: npm publish --provenance --access public
