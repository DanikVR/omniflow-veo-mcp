name: Publish to npm

# Пуш тега v1.2.3 → проверка синтаксиса → npm publish.
# Публикация выполняется только если задан секрет NPM_TOKEN (или LING): без него прогон
# остаётся зелёным, шаг publish пропускается. Токен: npm → Access Tokens → Granular, Read and write.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.LING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm run check
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: No npm token — publish skipped
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN secret is not set; package check passed, publish skipped."
